services:
  db:
    image: postgres:17.4-alpine
    container_name: "${DB_HOST}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql

  redis:
    image: redis:8.6.3-alpine
    container_name: "${REDIS_HOST}"
    restart: unless-stopped
    command: >
      --aclfile /usr/local/etc/redis/users.acl
      --appendonly yes  
      --maxmemory 512mb  
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
       - redis_data:/data
       - ./users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "${REDIS_USER}", "--pass", "${REDIS_PASS}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: unitly:latest
    container_name: unitly-app
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:

services:
  db:
    image: postgres:17.4-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    networks:
      - admin
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.3-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      --aclfile /usr/local/etc/redis/users.acl
      --appendonly yes  
      --maxmemory 512mb  
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    networks:
      - admin
      - backend
    volumes:
       - redis_data:/data
       - ./users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "${REDIS_USER}", "--pass", "${REDIS_PASS}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:3.4.1
    container_name: redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    networks:
      - admin
    volumes:
      - redisinsight_data:/data

  app:
    build: .
    image: unitly:latest
    container_name: unitly-app
    depends_on:
      - db
      - redis
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    networks:
      - backend
    env_file:
      - .env

networks:
  backend:
  admin:

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:

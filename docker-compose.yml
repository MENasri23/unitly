
services:
  db:
    image: postgres:17.4-alpine
    container_name: my-postgres
    restart: always
    environment:
      POSTGRES_USER: admin  
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: unitly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql

volumes:
  postgres_data:

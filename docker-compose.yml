services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - SERVER_PORT=${SERVER_PORT}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend

  db:
    image: postgres:17.4-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    networks:
      - admin
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: migrate/migrate:4
    container_name: migrations
    networks:
      - admin
    volumes:
      - ./migrations:/migrations
    command: -path=/migrations -database "postgres://${DB_USER}:${DB_PASS}@postgres:${DB_PORT}/${DB_NAME}?sslmode=disable" up
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:8.6.3-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      --aclfile /usr/local/etc/redis/users.acl
      --appendonly yes  
      --maxmemory 512mb  
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    networks:
      - admin
      - backend
    volumes:
      - redis_data:/data
      - ./users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "${REDIS_USER}", "--pass", "${REDIS_PASS}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:3.4.1
    container_name: redisinsight
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Bound ONLY to local loopback (127.0.0.1) for private SSH tunneling access
      - "127.0.0.1:5540:5540"
    networks:
      - admin
    volumes:
      - redisinsight_data:/data

  app:
    build: .
    image: unitly:latest
    container_name: unitly-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    volumes:
      # Mount the local .env file into the container as read-only
      - ./.env:/app/.env:ro

networks:
  backend:
  admin:

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
  caddy_data:
  caddy_config: